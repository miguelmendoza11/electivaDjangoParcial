<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Reserva</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; margin: 0; }
        .navbar { background: #007bff; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 20px; }
        .navbar a { color: white; text-decoration: none; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 5px; }
        .container { padding: 30px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, textarea, select { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-size: 15px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; }
        .error { color: red; font-size: 14px; margin-bottom: 10px; }
        .actions { display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>🔬 Reservas de Laboratorios</h1>
        <a href="{% url 'lista_reservas' %}">Volver</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>{% if object %}Editar{% else %}Nueva{% endif %} Reserva</h2>
            {% if form.non_field_errors %}
                <p class="error">{{ form.non_field_errors }}</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="error">{{ field.errors }}</p>
                    {% endif %}
                {% endfor %}
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'lista_reservas' %}" class="btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
